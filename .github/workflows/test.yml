name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate the pre-commit integration
        run: |
          python -m pip install pre-commit==4.6.2
          pre-commit validate-manifest .pre-commit-hooks.yaml
          pre-commit try-repo . repo-agent-instruction-security-scan --all-files
      - name: Scan this action's instructions
        id: self-scan
        uses: ./
        with:
          paths: AGENTS.md
          fail-on: high
      - name: Validate action reports and outputs
        env:
          JSON_REPORT: ${{ steps.self-scan.outputs.report }}
          SARIF_REPORT: ${{ steps.self-scan.outputs.sarif }}
        run: |
          node -e "const fs=require('node:fs'); const report=JSON.parse(fs.readFileSync(process.env.JSON_REPORT)); if (report.scannedFiles[0] !== 'AGENTS.md') process.exit(1)"
          node -e "const fs=require('node:fs'); const sarif=JSON.parse(fs.readFileSync(process.env.SARIF_REPORT)); if (sarif.version !== '2.1.0') process.exit(1)"
